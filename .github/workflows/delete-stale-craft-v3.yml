name: Delete stale craft_v3 branch

on:
  push:
    branches:
      - build/paper-api

permissions:
  contents: write

jobs:
  delete-stale-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete craft_v3 when it still exists
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin refs/heads/craft_v3 >/dev/null 2>&1; then
            git push origin --delete craft_v3
          else
            echo "craft_v3 is already absent"
          fi
